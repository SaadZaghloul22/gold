name: gold_prices
description: "أسعار الذهب اليوم — سعر جرام الذهب بكل العيارات في الخليج والعالم العربي، مع حاسبة وتنبيهات."
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.5+1
  shared_preferences: ^2.5.6
  http: ^1.2.2
  intl: ^0.20.3
  flutter_local_notifications: ^22.3.3
  workmanager: ^0.10.10
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo_400Regular.ttf
        - asset: assets/fonts/Cairo_600SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo_700Bold.ttf
          weight: 700
        - asset: assets/fonts/Cairo_800ExtraBold.ttf
          weight: 800
